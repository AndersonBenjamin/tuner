# Nginx da VPS: recebe tuner.codeshot.com.br e repassa para o container na porta 7070.
# Depois de ativar, rode o certbot para gerar o HTTPS (o microfone só funciona em HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name tuner.codeshot.com.br;

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
